[package]
name = "electrum-lite"
version = "0.0.1-beta.1"
edition = "2021"
rust-version = "1.99"
description = "Experimental Bitcoin block archive and persistent indexer"
repository = "https://github.com/AlbercoinDev/electrum-lite"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bitcoin = { version = "=0.32.102", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
url = "2.5"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
redb = "=4.4.0"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
