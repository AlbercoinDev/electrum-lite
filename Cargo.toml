[package]
name = "electrum-lite"
version = "0.0.1-beta.1"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.100"
bitcoin = "=0.32.102"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rocksdb = { version = "=0.24.0", default-features = false, features = ["bindgen-runtime"] }
serde_json = "1.0"
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
base64 = "0.22"
ctrlc = { version = "=3.4.5", features = ["termination"] }

[profile.release]
lto = "thin"
codegen-units = 1
